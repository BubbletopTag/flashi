/* ================= Review (spaced) ================= */
// One question per due card. Right: the card's next review moves further out. Wrong: back to Learn.
function showReview(scope) {
  const SESSION = 40;
  const learnOpt = readJSON('flashlet-learn', { typed: true, listening: true });
  app.innerHTML = bar({ back: true, title: 'Review', sub: scope.sub }) +
    '<div class="study"><div class="study-progress"><span></span></div><div class="study-body"><div class="study-col"></div></div></div>';
  wireBack(app, scope.back);
  const f = { col: $('.study-col', app), body: $('.study-body', app), bar: $('.study-progress span', app) };
  const allDue = shuffle(dueItems(scope.decks));
  const items = allDue.slice(0, SESSION);
  let i = 0, current = null, locked = false, onEnter = null, timer = 0;
  const remembered = [], missed = [];
  const multi = scope.decks.length > 1;
  prefetchClips(items.slice(0, 6).map(it => it.card));

  function stageFor(it) {
    if (!learnOpt.typed) return 'mc';
    if (it.card.audio && learnOpt.listening !== false && Math.random() < 0.35) return Math.random() < 0.5 ? 'listen-term' : 'listen-def';
    return 'write';
  }
  function next() {
    clearTimeout(timer); onEnter = null;
    setProgress(f, items.length ? i / items.length : 1);
    if (i >= items.length) return renderSummary();
    const it = items[i];
    current = { deck: it.deck, card: it.card, stage: stageFor(it) };
    locked = false;
    if (items[i + 2]) prefetchClips([items[i + 2].card]);
    render();
  }
  function render() {
    const { deck, card, stage } = current;
    const L = labelsOf(deck);
    const ask = answerSideFor(deck), promptSide = ask === 'term' ? 'definition' : 'term';
    const listen = stage !== 'write' && stage !== 'mc';
    current.side = stage === 'listen-term' ? 'term' : stage === 'listen-def' ? 'definition' : ask;
    let body;
    if (listen) {
      const askText = stage === 'listen-term'
        ? (isLangLabel(deck, L.term) ? 'Type what you hear, in ' + L.term : 'Type the ' + labelNoun(deck, 'term') + ' you hear')
        : (isLangLabel(deck, L.definition) ? 'Type what it means, in ' + L.definition : 'Type the ' + labelNoun(deck, 'definition'));
      body = '<div class="listen-box"><button type="button" class="listen-btn" data-play aria-label="Play the audio">' + icon('volume') + '</button>' +
        '<div class="listen-tools"><button type="button" class="btn text" data-play-again>Play again</button><button type="button" class="btn text" data-slow>Slower</button></div><p class="listen-status" aria-live="polite"></p></div>' +
        '<label class="q-ask" for="answer">' + esc(askText) + '</label>' + form();
    } else {
      const p = sideText(card, promptSide);
      body = '<div class="q-prompt-row">' + (promptSide === 'term' && card.audio ? '<button type="button" class="say" data-say aria-label="Play audio">' + icon('volume') + '</button>' : '') +
        '<div class="q-prompt' + (isLong(p) ? ' long' : '') + '"' + langAttr(deck, promptSide) + '>' + esc(p) + '</div></div>';
      if (stage === 'mc') {
        current.opts = shuffle([card].concat(distractors(deck, card, ask, 3)));
        body += '<p class="q-ask">Choose the matching ' + esc(labelNoun(deck, ask)) + '</p><div class="options">' + current.opts.map((o, k) => '<button type="button" class="opt" data-k="' + k + '"><span class="opt-key">' + (k + 1) + '</span><span' + langAttr(deck, ask) + '>' + esc(sideText(o, ask)) + '</span></button>').join('') + '</div>';
      } else body += '<label class="q-ask" for="answer">Type the ' + esc(labelNoun(deck, ask)) + '</label>' + form();
    }
    f.col.innerHTML = '<div class="q-card"><div class="q-label"><span>' + (listen ? icon('ear', 'sm') + 'Listen' : esc(promptSide === 'term' ? L.term : L.definition)) + '</span><span>' + (multi ? esc(deck.title) + ', ' : '') + (i + 1) + ' of ' + items.length + '</span></div>' + body + '<div class="fb"></div></div>';
    f.col.querySelectorAll('[data-k]').forEach(b => { b.onclick = () => chooseMC(+b.dataset.k); });
    const fm = $('[data-form]', f.col);

      '<div class="btn-row"><button type="button" class="btn text" data-dunno>I don\'t remember</button></div>';
  }
  function chooseMC(k) {
    if (locked || !current.opts || k >= current.opts.length) return;

    } else {
      fb.innerHTML = '<div class="feedback bad" role="status"><h3>Back to Learn</h3>' + dl(rows, deck) + note +
        '<p class="fb-note">This word goes back to Learn for a typing round' + (card.audio ? ' and listening' : '') + '.</p>' +
        '<div class="btn-row"><button type="button" class="btn" data-continue>Continue</button>' + hear + (canOverride ? '<button type="button" class="btn text" data-override>I was right</button>' : '') + '</div></div>';
      const c = $('[data-continue]', fb); c.onclick = next; onEnter = next;
      if (!matchMedia('(hover: none)').matches) c.focus({ preventScroll: true });
      if (current.stage !== 'write' && current.stage !== 'mc') setTimeout(() => playClip(card.audio), 450);
      const o = $('[data-override]', fb);
      if (o) o.onclick = () => {
        updateCard(deck.id, card.id, card.audio ? { lv: 3, ls: 2, due: 0 } : { lv: 3, due: 0 });
        reviewResult(deck.id, card, true);
        missed.pop(); remembered.push(current);
        sfx('right');
        next();
      };
    }
    const r = $('[data-replay]', fb); if (r) r.onclick = () => playClip(card.audio);
    setProgress(f, i / items.length);
    fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function dl(rows, deck) {
    return rows ? '<dl>' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd' + (r[2] ? ' class="strike"' : '') + langAttr(deck, r[3]) + '>' + esc(r[1]) + '</dd>').join('') + '</dl>' : '';
  }
  function renderSummary() {
    setProgress(f, 1); onEnter = null;
    const more = dueItems(scope.decks).length;
    if (!items.length) {
      const nxt = nextReview(scope.decks);
      f.col.innerHTML = '<div class="q-card"><h2 style="margin:0;font-size:24px;font-weight:400">Nothing to review right now</h2><p class="q-ask">' +
        (nxt ? 'Your next review is ' + fmtWhen(nxt) + '.' : 'Reviews start once you master a word in Learn.') + '</p><div class="btn-row"><button type="button" class="btn" data-go="' + esc(scope.back) + '">Back</button></div></div>';
    } else {
      const practice = scope.decks.length === 1 ? 'learn-' + scope.decks[0].id : scope.back;
      f.col.innerHTML = '<div class="q-card"><div class="big-stat">' + remembered.length + '<small>of ' + items.length + ' remembered</small></div>' +
        '<p class="q-ask">' + (missed.length ? plural(missed.length, 'word goes', 'words go') + ' back to Learn. The rest come back later, spaced further apart each time.' : 'Every word stuck. Each one comes back later, spaced further apart.') + '</p>' +
        (missed.length ? '<ul class="summary-list">' + missed.map(m => '<li><span' + langAttr(m.deck, 'term') + '>' + esc(m.card.term) + '</span><span class="tag t-learn">Back to Learn</span></li>').join('') + '</ul>' : '') +
        '<div class="btn-row">' + (more ? '<button type="button" class="btn" data-again>Review ' + more + ' more</button>' : '') +
        (missed.length ? '<button type="button" class="btn' + (more ? ' tonal' : '') + '" data-go="' + esc(practice) + '">Practice the missed words</button>' : '') +
        '<button type="button" class="btn text" data-go="' + esc(scope.back) + '">Done</button></div></div>';
      const a = $('[data-again]', f.col); if (a) a.onclick = () => showReview(scope);
    }
    f.col.querySelectorAll('[data-go]').forEach(b => { b.onclick = () => go(b.dataset.go); });
    if (items.length && !missed.length) sfx('clear');
  }
  const onKey = e => {
    if (openMenuEl || $('.scrim')) return;
    if (e.key === 'Enter' && onEnter && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); const fn = onEnter; onEnter = null; fn(); return; }
    if (typingTarget(e)) return;
    if (/^[1-4]$/.test(e.key) && current && current.opts && !locked) { e.preventDefault(); chooseMC(+e.key - 1); return; }
    if ((e.key === 'r' || e.key === 'R') && current && current.card.audio) { e.preventDefault(); playClip(current.card.audio); }
  };
  document.addEventListener('keydown', onKey);
  cleanupView = () => { document.removeEventListener('keydown', onKey); clearTimeout(timer); stopAudio(); };
  next();
}


/* ================= boot ================= */
applyTheme();
initStorage();
addEventListener('hashchange', route);
route();

})();
</script>
</body>
</html>
