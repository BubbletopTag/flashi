<style>
/* Layout: Flashi-style app. A solid app bar over a single centered column for the library, deck and guide pages; study modes fill the screen under the same bar. */
:root{
  --ground:#F9FAEF;
  --surface:#FFFFFF;
  --container:#EEEFE4;
  --container-high:#E2E3D8;
  --ink:#1A1C16;
  --ink-2:#44483D;
  --line:#C5C8BA;
  --divider:#E2E3D8;
  --primary:#4B662C;
  --on-primary:#FFFFFF;
  --primary-strong:#344E16;
  --tonal:#CCEDA4;
  --on-tonal:#344E16;
  --tint:#D8F9AE;
  --appbar:#4B662C;
  --on-appbar:#FFFFFF;
  --new:#303F9F;
  --learning:#C62828;
  --mastered:#1B5E20;
  --zero:rgba(26,28,22,.32);
  --good:#2E7D32;
  --good-tint:#E3F3D6;
  --bad:#BA1A1A;
  --bad-tint:#FFE4E0;
  --snack:#2F312A;
  --on-snack:#F1F2E6;
  --snack-action:#B1D18A;
  --scrim:rgba(0,0,0,.32);
  --state:rgba(26,28,22,.07);
  --shadow:0 1px 2px rgba(0,0,0,.12), 0 1px 3px 1px rgba(0,0,0,.06);
  --shadow-lift:0 4px 8px 3px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.2);
  --font:"Roboto", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12140E; --surface:#1E201A; --container:#282B24; --container-high:#33362E;
    --ink:#E2E3D8; --ink-2:#C5C8BA; --line:#5A5F52; --divider:#33362E;
    --primary:#B1D18A; --on-primary:#1F3701; --primary-strong:#CCEDA4;
    --tonal:#354E16; --on-tonal:#CCEDA4; --tint:#24301A;
    --appbar:#282B24; --on-appbar:#E2E3D8;
    --new:#9FA8DA; --learning:#EF9A9A; --mastered:#A5D6A7; --zero:rgba(226,227,216,.32);
    --good:#9CD67D; --good-tint:#1F3512; --bad:#FFB4AB; --bad-tint:#4A1C17;
    --snack:#E2E3D8; --on-snack:#2F312A; --snack-action:#4B662C;
    --scrim:rgba(0,0,0,.6); --state:rgba(226,227,216,.08);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-lift:0 4px 8px 3px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#12140E; --surface:#1E201A; --container:#282B24; --container-high:#33362E;
  --ink:#E2E3D8; --ink-2:#C5C8BA; --line:#5A5F52; --divider:#33362E;
  --primary:#B1D18A; --on-primary:#1F3701; --primary-strong:#CCEDA4;
  --tonal:#354E16; --on-tonal:#CCEDA4; --tint:#24301A;
  --appbar:#282B24; --on-appbar:#E2E3D8;
  --new:#9FA8DA; --learning:#EF9A9A; --mastered:#A5D6A7; --zero:rgba(226,227,216,.32);
  --good:#9CD67D; --good-tint:#1F3512; --bad:#FFB4AB; --bad-tint:#4A1C17;
  --snack:#E2E3D8; --on-snack:#2F312A; --snack-action:#4B662C;
  --scrim:rgba(0,0,0,.6); --state:rgba(226,227,216,.08);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --shadow-lift:0 4px 8px 3px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--appbar)}
html.fixed,html.fixed body{height:100%}
html.fixed body{overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:24px;height:24px;fill:currentColor;display:block;flex:none}
.icon.sm{width:20px;height:20px}
.muted{color:var(--ink-2)}

/* ---------- app frame ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
html.fixed #app{height:100%;min-height:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;flex:none;display:flex;align-items:center;gap:4px;min-height:56px;
  background:var(--appbar);color:var(--on-appbar);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bar > .icon-btn:first-child{margin-left:-12px}
.bar > .icon-btn:last-child{margin-right:-12px}
.bar-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-block:6px}
.bar-titles.indent{padding-left:8px}
.bar-title{font-size:20px;font-weight:500;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:14px;line-height:18px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand-name{font-size:21px;font-weight:500;letter-spacing:.1px}
.icon-btn{flex:none;width:48px;height:48px;border:0;padding:12px;background:transparent;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.icon-btn:disabled{opacity:.38;cursor:default}
@media (hover:hover){.icon-btn:not(:disabled):hover{background:var(--state)} .bar .icon-btn:hover{background:rgba(255,255,255,.12)}}
.page{width:100%;max-width:800px;margin:0 auto;flex:1;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px calc(112px + env(safe-area-inset-bottom, 0px))}
.page > * + *{margin-top:20px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:28px}
.section-head h2{margin:0;font-size:15px;font-weight:500;color:var(--ink-2)}
.section-head + *{margin-top:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 20px;border-radius:999px;border:0;
  background:var(--primary);color:var(--on-primary);font-weight:500;font-size:15px;line-height:1.2;text-decoration:none;white-space:nowrap;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn .icon{width:18px;height:18px}
.btn.tonal{background:var(--tonal);color:var(--on-tonal)}
.btn.outline{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--line)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.danger-outline{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.data-panel p{margin:0 0 12px;color:var(--ink-2);font-size:15px}
.manage-list{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;margin:0 -4px;padding:0 4px}
.manage-group{border:1px solid var(--divider);border-radius:14px;padding:4px 12px}
.manage-group .manage-row{padding-left:8px}
.manage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--divider);font-size:15px}
.manage-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--divider)}
.manage-row:last-child{border-bottom:0}
.manage-name{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.manage-name b{font-weight:500;font-size:16px}
.manage-name small{font-size:13px;color:var(--ink-2)}
.del{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:999px;border:0;background:var(--bad-tint);color:var(--bad);padding:0 10px;font-weight:500;font-size:14px}
.del .icon{width:20px;height:20px}
.del.wide{padding:0 14px}
.del.armed{background:var(--bad);color:var(--surface);padding:0 16px}
.btn.big{min-height:52px;font-size:16px;padding:0 28px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover){.btn:not(:disabled):hover{background-image:linear-gradient(var(--state),var(--state))}}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- banners, cards, lists ---------- */
.banner{display:flex;gap:12px;align-items:center;background:var(--container);color:var(--ink-2);padding:12px 16px;border-radius:12px;font-size:14px;line-height:20px}
.banner p{margin:0;flex:1;min-width:0}
.panel{background:var(--surface);border:1px solid var(--divider);border-radius:16px;padding:20px}
.continue{background:var(--tint);border-radius:16px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.continue-text{flex:1 1 220px;min-width:0}
.continue-text b{display:block;font-size:18px;font-weight:500;line-height:1.3}
.continue-text span{font-size:14px;color:var(--ink-2)}
.list{background:var(--surface);border:1px solid var(--divider);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;text-align:left;background:none;border:0;border-top:1px solid var(--divider);color:inherit;text-decoration:none}
.row:first-child{border-top:0}
@media (hover:hover){button.row:hover{background:var(--state)}}
.row-main{flex:1;min-width:0}
.row-title{font-size:17px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--ink-2);line-height:1.4}
.counts{display:flex;gap:10px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;flex:none}
.c-new{color:var(--new)} .c-learn{color:var(--learning)} .c-done{color:var(--mastered)} .c-zero{color:var(--zero)}
.empty{padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty h3{margin:0 0 6px;font-size:18px;font-weight:500;color:var(--ink)}
.empty p{margin:0 auto 16px;max-width:42ch;font-size:15px}
.empty .btn-row{justify-content:center}
.row.child{padding-left:52px;min-height:58px}
.row.group-row{padding:0;gap:0}
.chev-btn{flex:none;align-self:stretch;width:48px;display:grid;place-items:center;border:0;background:none;color:var(--ink-2);padding:0 0 0 6px}
.chev-btn .icon{transition:transform .2s ease}
.chev-btn[aria-expanded="true"] .icon{transform:rotate(90deg)}
.group-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px 12px 4px;border:0;background:none;text-align:left;color:inherit}
@media (hover:hover){.chev-btn:hover,.group-open:hover{background:var(--state)}}
.mini{display:flex;height:6px;max-width:240px;margin:6px 0 4px;border-radius:999px;overflow:hidden;background:var(--container)}
.mini span{display:block;height:100%}
.mini .s-done{background:var(--mastered)} .mini .s-learn{background:var(--learning)}
button.deck-group{border:0;background:none;padding:0;font:inherit;font-size:14px;font-weight:500;color:var(--primary);cursor:pointer;margin-bottom:2px;text-align:left}
@media (hover:hover){button.deck-group:hover{text-decoration:underline}}
.banner.today .btn{min-height:32px;padding:0 10px}
.step .btn:disabled{opacity:.5}
.row.child .row-title{font-size:16px}
.group-row .chev{flex:none;width:28px;height:28px;margin-left:-6px;display:grid;place-items:center;color:var(--ink-2);transition:transform .2s ease}
.group-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.deck-group{font-size:14px;font-weight:500;color:var(--primary);margin-bottom:2px}
.card-note{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.fc-note{font-size:15px;line-height:1.45;color:var(--ink-2);max-width:44ch}
.fb-note{margin:2px 0 0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--container);color:var(--ink-2);vertical-align:2px;margin-left:6px}

/* ---------- FAB, menus, sheets, snackbar ---------- */
.fab{position:fixed;z-index:40;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;
  background:var(--tonal);color:var(--on-tonal);font-weight:500;font-size:15px;box-shadow:var(--shadow-lift)}

.menu{position:fixed;z-index:80;min-width:220px;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 0;box-shadow:var(--shadow-lift);border:1px solid var(--divider)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:0 16px;border:0;background:none;text-align:left;font-size:15px}
.menu button .icon{width:20px;height:20px;color:var(--ink-2)}
.menu button .check{margin-left:auto;color:var(--primary)}
.menu hr{border:0;border-top:1px solid var(--divider);margin:6px 0}
.menu .menu-label{padding:8px 16px 4px;font-size:13px;color:var(--ink-2)}
@media (hover:hover){.menu button:hover{background:var(--state)}}
.menu button.danger{color:var(--bad)}
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:24px;padding:24px;box-shadow:var(--shadow-lift);display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:22px;font-weight:400;line-height:1.3}
.sheet p{margin:0;color:var(--ink-2);font-size:15px}
.sheet .btn-row{justify-content:flex-end;margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500;color:var(--ink-2)}
.input,.textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px 14px;font-size:16px;line-height:1.4;outline:none}
.input:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.textarea{min-height:180px;resize:vertical;font-family:var(--mono);font-size:14px}
.error-box{background:var(--bad-tint);color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.snack{position:fixed;z-index:90;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 8px 10px 16px;border-radius:8px;background:var(--snack);color:var(--on-snack);font-size:14px;line-height:20px;box-shadow:var(--shadow-lift);
  animation:snack-in .2s ease-out}
.snack p{margin:0;flex:1}
.snack button{border:0;background:none;color:var(--snack-action);font-weight:500;padding:8px 10px;border-radius:6px}
@keyframes snack-in{from{opacity:0;transform:translateY(8px)}}
.drop-overlay{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:var(--scrim);pointer-events:none}
.drop-overlay div{background:var(--surface);border:2px dashed var(--primary);color:var(--ink);border-radius:24px;padding:32px 40px;font-size:18px;font-weight:500}

/* ---------- deck page ---------- */
.deck-head h1{margin:0;font-size:28px;font-weight:400;line-height:1.25;overflow-wrap:anywhere}
.deck-head p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.deck-meta{font-size:14px;color:var(--ink-2);margin-top:4px}
.mastery{display:flex;flex-direction:column;gap:10px}
.mbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--container)}

.mbar .s-new{background:var(--new)} .mbar .s-learn{background:var(--learning)} .mbar .s-done{background:var(--mastered)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--ink-2)}
.legend b{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;margin-right:4px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:36px 1fr;gap:4px 14px;background:var(--surface);border:1px solid var(--divider);border-radius:16px;padding:16px 18px}
.step.current{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.step-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:16px;background:var(--container);color:var(--ink-2)}
.step.current .step-num{background:var(--primary);color:var(--on-primary)}
.step.done .step-num{background:var(--tonal);color:var(--on-tonal)}
.step-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.step-body h3{margin:0;font-size:18px;font-weight:500;line-height:36px}
.step-body p{margin:0;font-size:15px;color:var(--ink-2)}
.step-status{font-size:14px;color:var(--ink);font-weight:500}
.step .btn-row{margin-top:8px}
.cards-table{width:100%;border-collapse:collapse;font-size:15px}
.cards-table td{padding:12px 16px;border-top:1px solid var(--divider);vertical-align:top;overflow-wrap:break-word}
.cards-table tr:first-child td{border-top:0}
.cards-table td:first-child{width:40%;font-weight:500}
@media (max-width:480px){.cards-table td{padding:10px 10px}.cards-table td:first-child{width:auto}.term-cell{gap:8px}.term-cell .say{width:30px;height:30px}.term-cell .say .icon{width:18px;height:18px}}
.cards-table td:last-child{width:28px;padding-left:0}
.lv{display:inline-block;width:10px;height:10px;border-radius:50%;margin-top:6px}
.lv-0{background:var(--new)} .lv-1,.lv-2{background:var(--learning)} .lv-3{background:var(--mastered)}

/* ---------- study frame ---------- */
.study{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.study-progress{flex:none;height:4px;background:var(--container)}
.study-progress span{display:block;height:100%;width:0;background:var(--primary);transition:width .3s ease}
.study-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px calc(16px + env(safe-area-inset-bottom, 0px))}
.study-col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--tonal);border-color:var(--tonal);color:var(--on-tonal)}
.chip .icon{width:18px;height:18px}
.chip:disabled{opacity:.4}

/* ---------- flashcards ---------- */
.fc-wrap{flex:1;min-height:260px;display:flex;flex-direction:column;gap:14px}
.fc-count{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fc-stage{flex:1;min-height:240px;position:relative;perspective:1400px;-webkit-perspective:1400px}
.fc-card{position:absolute;inset:0;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .25s ease, opacity .25s ease}
.fc-card.dragging{transition:none}
.fc-inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}

.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 24px 52px;
  background:var(--surface);border:1px solid var(--divider);border-radius:20px;box-shadow:var(--shadow);text-align:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc-label{position:absolute;top:16px;left:20px;font-size:13px;font-weight:500;color:var(--ink-2)}
.fc-text{font-size:clamp(24px,5.2vw,36px);line-height:1.25;overflow-wrap:anywhere;max-width:100%}
.fc-text.long{font-size:clamp(18px,3.6vw,24px)}
.fc-tip{position:absolute;bottom:16px;left:0;right:0;font-size:13px;color:var(--ink-2)}
.fc-hint{font-size:15px;color:var(--ink-2);max-width:40ch}
.fc-face.has-hint{padding-bottom:112px}
.fc-hintbox{position:absolute;left:16px;right:16px;bottom:40px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fc-stamp{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:2;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;opacity:0;pointer-events:none}
.fc-stamp.know{background:var(--good-tint);color:var(--good)}
.fc-stamp.learn{background:var(--bad-tint);color:var(--learning)}
.fc-card.leaving-left{transform:translateX(-120%) rotate(-8deg);opacity:0}
.fc-card.leaving-right{transform:translateX(120%) rotate(8deg);opacity:0}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc-actions .btn{min-height:56px;font-size:16px}
.btn.learn-btn{background:transparent;color:var(--learning);box-shadow:inset 0 0 0 1.5px var(--learning)}
.keys{font-size:13px;color:var(--ink-2);text-align:center}
@media (hover:none){.keys{display:none}}

/* ---------- audio ---------- */
.say{flex:none;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:var(--container);color:var(--primary);padding:0;vertical-align:middle}
.say .icon{width:20px;height:20px}
.say.playing,.fc-audio.playing{background:var(--tonal);color:var(--on-tonal)}
@media (hover:hover){.say:hover{background:var(--tint)}}
.term-cell{display:inline-flex;align-items:center;gap:10px}
.fc-audio{position:absolute;top:10px;right:10px;z-index:2;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--container);color:var(--primary);padding:0}
.fc-audio .icon{width:26px;height:26px}
.q-prompt-row{display:flex;align-items:center;gap:12px}
.q-label span{display:inline-flex;align-items:center;gap:6px}
.q-label .icon{width:18px;height:18px}
.listen-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.listen-btn{width:104px;height:104px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--tonal);color:var(--on-tonal);box-shadow:var(--shadow);touch-action:manipulation}
.listen-btn .icon{width:48px;height:48px}
.listen-btn.playing{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--tint),var(--shadow)}50%{box-shadow:0 0 0 14px var(--tint),var(--shadow)}}
.listen-tools{display:flex;gap:4px}
.listen-status{margin:0;min-height:20px;font-size:14px;color:var(--ink-2);text-align:center}
.feedback .btn-row .btn.text .icon{width:18px;height:18px}

/* ---------- learn & test ---------- */
.q-card{background:var(--surface);border:1px solid var(--divider);border-radius:20px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:16px}
.q-label{font-size:13px;font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px}
.q-prompt{font-size:clamp(22px,4.6vw,30px);line-height:1.3;overflow-wrap:anywhere}
.q-prompt.long{font-size:clamp(18px,3.4vw,22px)}
.q-ask{font-size:15px;color:var(--ink-2);margin:0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.options{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;text-align:left;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;line-height:1.35;overflow-wrap:anywhere;touch-action:manipulation}
.opt-key{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;background:var(--container);color:var(--ink-2)}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--primary)}}

.opt.wrong .opt-key{background:var(--bad);color:var(--surface)}

.opt:disabled{cursor:default;color:inherit}
.write-row{display:flex;gap:10px;flex-wrap:wrap}
.write-row .input{flex:1 1 240px;min-height:52px;font-size:18px}
.feedback{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.feedback.good{background:var(--good-tint)}
.feedback.bad{background:var(--bad-tint)}

.feedback dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.feedback dt{color:var(--ink-2)}
.feedback dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.feedback .strike{text-decoration:line-through;font-weight:400}
.feedback .btn-row{margin-top:4px}
.hint-line{font-size:15px;color:var(--ink-2)}
.summary-list{list-style:none;margin:0;padding:0}
.summary-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--divider);font-size:15px}

.tag{flex:none;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;white-space:nowrap}
.tag.t-done{background:var(--good-tint);color:var(--mastered)}
.tag.t-learn{background:var(--bad-tint);color:var(--learning)}
.tag.t-next{background:var(--container);color:var(--ink-2)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
.celebrate{margin:0;font-size:26px;font-weight:500;color:var(--primary)}
.big-stat{font-size:52px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}

.setup{display:flex;flex-direction:column;gap:18px}
.setup h3{margin:0 0 8px;font-size:15px;font-weight:500;color:var(--ink-2)}
.test-q{scroll-margin-top:72px}
.test-q.graded-good{border-color:var(--good)}
.test-q.graded-bad{border-color:var(--bad)}
.tf-claim{font-size:18px;padding:12px 16px;border-radius:12px;background:var(--container);overflow-wrap:anywhere}
.tf-claim small{display:block;font-size:13px;color:var(--ink-2)}
.result-note{font-size:15px;font-weight:500}
.result-note.good{color:var(--good)} .result-note.bad{color:var(--bad)}

/* ---------- match ---------- */
.match-stage{flex:1;min-height:0;position:relative;margin:0 auto;width:100%;max-width:1400px}
.match-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px))}
.clock{position:relative;display:flex;align-items:baseline;gap:5px}

.clock-unit{font-size:14px;font-weight:500;color:var(--ink-2)}
.penalty{position:absolute;left:100%;top:-8px;margin-left:8px;color:var(--bad);font-weight:700;font-size:15px;opacity:0;pointer-events:none;white-space:nowrap}

@keyframes penalty{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.mode-chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.mode-chip .icon{width:18px;height:18px}
.board{position:absolute;inset:0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.board.tap{display:grid;gap:10px;touch-action:manipulation}
.tile{appearance:none;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--divider);border-radius:12px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;margin:0;font-weight:500;line-height:1.2;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  transition:border-color .12s,background-color .12s,color .12s,opacity .25s,transform .25s}
.tile .t{display:block;max-width:100%;overflow-wrap:normal;word-break:normal}
@media (hover:hover){.tile:hover{border-color:var(--line)}}
.board.tap .tile{min-width:0;min-height:0;padding:6px}
.board.drag .tile{position:absolute;touch-action:none;cursor:grab;
  transition:border-color .12s,background-color .12s,color .12s,opacity .25s,transform .25s,left .22s ease,top .22s ease}
.board.drag .tile.dragging{cursor:grabbing;box-shadow:var(--shadow-lift);transform:scale(1.03);transition:border-color .12s,background-color .12s,color .12s,transform .12s}
.tile.selected,.tile.target{border-color:var(--primary);background:var(--tint)}
.tile.correct{border-color:var(--good);background:var(--good-tint);color:var(--good)}
.tile.gone{opacity:0;transform:scale(.9);pointer-events:none}
.tile.cleared{visibility:hidden}
.tile.wrong{border-color:var(--bad);background:var(--bad-tint);color:var(--bad);animation:shake .32s}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:5px}60%{translate:-4px}80%{translate:3px}}
.tile.ghost{box-shadow:none;pointer-events:none}
.tile.ghost .t{visibility:hidden}
.tile.reveal .t{animation:deal .3s ease both;animation-delay:var(--d,0ms)}
@keyframes deal{from{opacity:0;transform:translateY(5px)}}
.overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:var(--scrim);padding:16px}
.overlay .sheet{max-height:100%}
.result-time{font-size:56px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.result-time small{font-size:18px;color:var(--ink-2);margin-left:6px}
.review{width:100%;border-collapse:collapse;font-size:15px}
.review th{text-align:left;font-size:13px;font-weight:500;color:var(--ink-2);padding:6px 12px 6px 0;border-bottom:1px solid var(--line)}
.review td{padding:9px 12px 9px 0;border-bottom:1px solid var(--divider);overflow-wrap:anywhere}

/* ---------- meteor ---------- */
.sky{flex:1;min-height:0;position:relative;overflow:hidden;
  background-color:var(--ground);
  background-image:radial-gradient(var(--divider) 1.2px, transparent 1.3px);background-size:28px 28px}
.hud{position:absolute;top:12px;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}

.hud-score small{font-size:13px;color:var(--ink-2);margin-left:6px;font-weight:500}
.lives{display:flex;gap:4px;color:var(--learning);background:var(--surface);border:1px solid var(--divider);border-radius:999px;padding:6px 10px}
.lives .icon{width:22px;height:22px}
.lives .lost{color:var(--zero)}
.combo{position:absolute;top:58px;left:max(16px, env(safe-area-inset-left, 0px));font-size:14px;font-weight:500;color:var(--primary);z-index:5}

.meteor::before,.meteor::after{content:"";position:absolute;border-radius:50%;background:var(--container);pointer-events:none}
.meteor::before{width:12px;height:10px;top:9px;left:16%}
.meteor::after{width:7px;height:7px;bottom:10px;right:18%}
.meteor.hit{border-color:var(--good);background:var(--good-tint);opacity:0}
.meteor.miss{border-color:var(--bad);background:var(--bad-tint);color:var(--bad);opacity:0;transition:opacity .5s .25s, border-color .1s, background-color .1s}
.meteor.fade{opacity:0}
.ground{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--surface);border-top:2px dashed var(--line);
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));text-align:center}
.ground-label{font-size:13px;font-weight:500;color:var(--ink-2)}
.ground-term{font-size:clamp(20px,4.4vw,28px);line-height:1.25;overflow-wrap:anywhere}
.ground.flash-bad{background:var(--bad-tint)}
.ground.flash-good{background:var(--good-tint)}
.reveal-answer{position:absolute;z-index:6;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:var(--bad-tint);color:var(--bad);font-weight:500;font-size:15px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

.doc{max-width:720px}
.doc h1{font-size:30px;font-weight:400;margin:0;line-height:1.25}
.doc h2{font-size:21px;font-weight:500;margin:36px 0 0}
.doc h3{font-size:17px;font-weight:500;margin:24px 0 0}
.doc p,.doc li{max-width:66ch;font-size:16px}
.doc p{margin:10px 0 0}
.doc ul,.doc ol{margin:10px 0 0;padding-left:22px}
.doc li + li{margin-top:4px}
.doc code{font-family:var(--mono);font-size:.88em;background:var(--container);padding:1px 5px;border-radius:5px}
.doc .lead{font-size:18px;color:var(--ink-2)}
.code{position:relative;margin-top:12px;background:var(--container);border-radius:12px;overflow:hidden}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.55;tab-size:2}
.code pre code{background:none;padding:0;font-size:inherit}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--divider);font-size:13px;color:var(--ink-2)}
.code-head .btn{min-height:32px;padding:0 12px;font-size:13px}
.table-wrap{margin-top:12px;overflow-x:auto;border:1px solid var(--divider);border-radius:12px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
.doc th,.doc td{text-align:left;padding:10px 12px;border-top:1px solid var(--divider);vertical-align:top}
.doc th{border-top:0;font-weight:500;color:var(--ink-2);background:var(--container)}
.doc td:first-child{white-space:nowrap}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

@media (max-width:440px){
  .bar-title{font-size:18px}
  .brand-name{font-size:19px}
  .deck-head h1{font-size:24px}
  .sheet{padding:20px;border-radius:20px}
  .board.tap{gap:8px}
  .clock-num{font-size:26px}
  .mode-chip span{display:none}
  .fab span{display:none}
  .fab{padding:0 16px}
}
@media (prefers-reduced-motion: reduce){

}

/* ================= store ================= */
const store = {

// Deletes every imported deck, all progress, and all audio, here and in the person's account storage.

  store.user.forEach((v, k) => { docIds.add('deck-' + k); audioKeys(v.deck).forEach(a => clipIds.add(String(a).replace(/^clip:/, ''))); });

const app = $('#app');

function go(hash) {
  if (location.hash.slice(1) === hash) route();
  else location.hash = hash;
}
function route() {
  closeMenu();
  if (cleanupView) { try { cleanupView(); } catch (e) { console.error(e); } cleanupView = null; }
  const h = decodeURIComponent(location.hash.slice(1));
  document.documentElement.classList.remove('fixed');
  currentRoute = { name: 'library' };
  if (h === 'format') { currentRoute = { name: 'guide' }; return showGuide(); }
  if (h === 'review-all') {
    currentRoute = { name: 'review' };
    document.documentElement.classList.add('fixed'); window.scrollTo(0, 0);
    return showReview({ sub: 'All decks', back: '', decks: userDecks().concat(BUILTIN) });
  }
  const gm = h.match(/^(group|review-group)-([a-z0-9-]+)$/);
  if (gm) {
    const g = findGroup(gm[2]);
    if (!g) {
      if (store.mode === 'cloud' && !store.synced) { currentRoute = { name: 'waiting', hash: h }; return showWaiting(); }
      history.replaceState(null, '', location.pathname + location.search);
      return showLibrary();
    }
    if (gm[1] === 'group') { currentRoute = { name: 'group', slug: g.slug }; return showGroup(g); }
    currentRoute = { name: 'review' };
    document.documentElement.classList.add('fixed'); window.scrollTo(0, 0);
    return showReview({ sub: g.name, back: 'group-' + g.slug, decks: g.decks });
  }
  const m = h.match(/^(deck|flashcards|learn|test|match|meteor|review)-([a-z0-9-]+)$/);
  if (m) {
    const deck = getDeck(m[2]);
    if (!deck) {
      if (store.mode === 'cloud' && !store.synced) { currentRoute = { name: 'waiting', hash: h }; return showWaiting(); }
      toast('That deck is not in your library.');
      history.replaceState(null, '', location.pathname + location.search);
      return showLibrary();
    }
    currentRoute = { name: m[1], deckId: deck.id };
    if (m[1] === 'deck') return showDeck(deck);
    document.documentElement.classList.add('fixed');
    window.scrollTo(0, 0);

    touchDeck(deck.id);

}

  if (currentRoute.name === 'deck') {
    const d = getDeck(currentRoute.deckId);
    if (!d) return go('');
    return showDeck(d, true);
  }
  if (currentRoute.name === 'group') {

function manageSheet() {
  const s = openSheet('<h2>Manage decks</h2><p>Deleting a deck also deletes its progress and audio. Tap the trash, then tap Delete to confirm.</p>' +
    '<div class="manage-list" data-list></div>' +
    '<div class="btn-row"><button type="button" class="btn danger" data-wipe>' + icon('delete') + 'Wipe all data</button><button type="button" class="btn" data-done>Done</button></div>');

  const render = () => {
    const decks = userDecks();
    if (!decks.length) { listEl.innerHTML = '<p class="muted" style="margin:0">No imported decks.</p>'; return; }
    const items = [], groups = new Map();
    decks.forEach(d => {
      if (!d.group) { items.push(d); return; }
      if (!groups.has(d.group)) { const g = { group: d.group, decks: [] }; groups.set(d.group, g); items.push(g); }
      groups.get(d.group).decks.push(d);
    });
    listEl.innerHTML = items.map(it => it.group
      ? '<div class="manage-group"><div class="manage-head"><b>' + esc(it.group) + '</b><button type="button" class="del wide" data-del-group="' + esc(it.group) + '">Delete group</button></div>' +

      : row(it)).join('');
    listEl.querySelectorAll('.del').forEach(b => {
      b.onclick = () => {
        if (!b.classList.contains('armed')) {
          listEl.querySelectorAll('.del.armed').forEach(x => { if (x !== b) disarm(x); });
          b.dataset.label = b.innerHTML; b.classList.add('armed'); b.textContent = b.dataset.delGroup ? 'Delete all' : 'Delete';
          b.disarmTimer = setTimeout(() => disarm(b), 4000);
          return;

        else { const d = getDeck(b.dataset.del); removeDeck(b.dataset.del); if (d) toast('Deleted ' + d.title + '.'); }

  render();

}

let fileInput = null;
function pickFiles() {
  if (!fileInput) {
    fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.hidden = true; fileInput.id = 'file-input';
    fileInput.accept = '.json,.zip,.txt,.csv,.tsv,application/json,application/zip,application/x-zip-compressed,text/plain,text/csv,text/tab-separated-values';
    fileInput.onchange = () => { const files = Array.from(fileInput.files || []); fileInput.value = ''; importFiles(files); };
    document.body.appendChild(fileInput);
  }
  fileInput.click();
}
function readText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ''));
    r.onerror = () => reject(new ImportError('Flashlet could not read ' + file.name + '.'));
    r.readAsText(file);
  });
}
function readBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new ImportError('Flashlet could not read ' + file.name + '.'));
    r.readAsArrayBuffer(file);
  });
}
// Decks from text or JSON may carry audio only as data: URIs; paths need a .flashlet.zip.
function splitAudio(decks, notes, name) {
  const clips = inlineClips(decks);
  let stripped = 0;
  decks.forEach(d => d.cards.forEach(c => { if (c.audio && !/^data:/i.test(c.audio)) { delete c.audio; stripped++; } }));
  if (stripped) notes.push({ name, msg: plural(stripped, 'card points', 'cards point') + ' to audio files, which only come along inside a .flashlet.zip package. The cards were imported without that audio.' });
  return clips;
}
async function importFiles(files) {
  if (!files.length) return;
  const decks = [], errors = [], clips = [];
  for (const f of files) {
    const isZip = /\.zip$/i.test(f.name) || /zip/.test(f.type || '');
    const limit = 30 * 1024 * 1024;
    if (f.size > limit) { errors.push({ name: f.name, msg: 'The file is ' + Math.round(f.size / 1048576) + ' MB. Deck files can be up to 30 MB.' }); continue; }
    try {
      if (isZip) {
        const pkg = await parseZipPackage(await readBuffer(f), f.name);
        pkg.decks.forEach(d => decks.push(d));
        inlineClips(pkg.decks).concat(pkg.clips).forEach(c => clips.push(c));
      } else {
        const parsed = parseImport(await readText(f), f.name);
        splitAudio(parsed, errors, f.name).forEach(c => clips.push(c));
        parsed.forEach(d => decks.push(d));
      }
    } catch (e) { errors.push({ name: f.name, msg: e instanceof ImportError ? e.message : 'Something went wrong reading this file.' }); }
  }
  finishImport(decks, errors, clips);
}
async function finishImport(decks, errors, clips) {
  let result = { added: [], updated: [] };
  if (clips && clips.length) {
    const status = document.createElement('div');
    status.className = 'snack'; status.setAttribute('role', 'status');
    status.innerHTML = '<p>Saving audio, 0 of ' + clips.length + '</p>';
    document.body.appendChild(status);
    try {
      const where = await storeClips(clips, (n, total) => { status.firstChild.textContent = 'Saving audio, ' + n + ' of ' + total; });
      if (store.mode === 'cloud' && (where.local || where.memory)) errors.push({ name: 'Audio', msg: plural(where.local + where.memory, 'clip') + ' could not be saved to your account, so ' + (where.local + where.memory === 1 ? 'it plays' : 'they play') + ' only in this browser.' });
      else if (where.memory) errors.push({ name: 'Audio', msg: 'This browser would not store the audio, so it plays only until you close Flashlet.' });
    } catch (e) {
      errors.push({ name: 'Audio', msg: e instanceof ImportError ? e.message : 'Some audio could not be saved.' });
      clips.forEach(c => { if (c.card.audio && String(c.card.audio).indexOf('clip:') !== 0) delete c.card.audio; });
    }
    status.remove();
  }
  if (decks.length) result = addDecks(decks);
  if (errors.length) {
    const s = openSheet('<h2>' + (decks.length ? 'Import notes' : 'Import failed') + '</h2>' +
      errors.map(er => '<div class="field"><label></label><div class="error-box"></div></div>').join('') +
      '<div class="btn-row"><button type="button" class="btn text" data-guide>Deck format guide</button><button type="button" class="btn" data-ok>OK</button></div>');
    $$('.field', s.el).forEach((f, i) => { f.querySelector('label').textContent = errors[i].name; f.querySelector('.error-box').textContent = errors[i].msg; });
    s.el.querySelector('[data-ok]').onclick = s.close;
    s.el.querySelector('[data-guide]').onclick = () => { s.close(); go('format'); };
  }
  const all = result.added.concat(result.updated);
  if (!all.length) return;
  let msg;
  if (all.length === 1) {
    const d = all[0];
    msg = (result.updated.length ? 'Updated ' : 'Imported ') + d.title + ' (' + plural(d.cards.length, 'card') + (clips && clips.length ? ' with audio' : '') + ')' + (result.updated.length && d.version ? ' to version ' + d.version : '') + '.';
  } else if (all[0].group && all.every(d => d.group === all[0].group)) {
    const cards = all.reduce((n, d) => n + d.cards.length, 0);
    msg = (result.added.length ? 'Imported ' : 'Updated ') + all[0].group + ' (' + plural(all.length, 'deck') + ', ' + plural(cards, 'card') + (clips && clips.length ? ', ' + plural(clips.length, 'audio clip') : '') + ').';
  } else {
    msg = 'Imported ' + plural(result.added.length, 'deck') + (result.updated.length ? ' and updated ' + plural(result.updated.length, 'deck') : '') + '.';
  }
  toast(msg, all.length === 1 ? { label: 'Open', run: () => go('deck-' + all[0].id) } : null);
}

function enableDrop() {
  let overlay = null, depth = 0;
  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0;
  const enter = e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; if (!overlay) { overlay = document.createElement('div'); overlay.className = 'drop-overlay'; overlay.innerHTML = '<div>Drop deck files to import</div>'; document.body.appendChild(overlay); } };
  const over = e => { if (hasFiles(e)) e.preventDefault(); };
  const leave = e => { if (!hasFiles(e)) return; depth--; if (depth <= 0 && overlay) { overlay.remove(); overlay = null; depth = 0; } };
  const drop = e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; if (overlay) { overlay.remove(); overlay = null; } importFiles(Array.from(e.dataTransfer.files || [])); };
  document.addEventListener('dragenter', enter); document.addEventListener('dragover', over);
  document.addEventListener('dragleave', leave); document.addEventListener('drop', drop);
  return () => {
    document.removeEventListener('dragenter', enter); document.removeEventListener('dragover', over);
    document.removeEventListener('dragleave', leave); document.removeEventListener('drop', drop);
    if (overlay) overlay.remove();
  };
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function readJSON(key, fallback) { try { return Object.assign({}, fallback, JSON.parse(lsGet(key) || '{}')); } catch (e) { return Object.assign({}, fallback); } }
function studyFrame(deck, title, opts) {
  opts = opts || {};

    '<div class="study">' + (opts.progress ? '<div class="study-progress"><span></span></div>' : '') +

}
function setProgress(f, frac) { if (f.bar) f.bar.style.width = (clamp(frac, 0, 1) * 100).toFixed(1) + '%'; }
const isLong = s => String(s).length > 60;
function langAttr(deck, side) { const l = langOf(deck, side); return l ? ' lang="' + esc(l) + '"' : ''; }
function masteryBlock(deck) {
  const c = deckCounts(deck);

    '<div class="legend"><span class="c-done"><b>' + c.done + '</b>mastered</span><span class="c-learn"><b>' + c.learn + '</b>learning</span><span class="c-new"><b>' + c.new + '</b>new</span></div></div>';
}

/* ================= Flashcards (introduce) ================= */
function showFlashcards(deck) {
  const L = labelsOf(deck);
  const opt = readJSON('flashlet-flashcards', { shuffle: false, autoplay: true });
  const frontKey = 'flashlet-front:' + deck.id;
  opt.front = lsGet(frontKey) || (answerSideFor(deck) === 'term' ? 'definition' : 'term');
  let limited = null;
  const deckAudio = deck.cards.some(c => c.audio);
  const sayBtn = (card, side) => (side === 'term' && card.audio ? '<button type="button" class="fc-audio" data-say aria-label="Play audio">' + icon('volume') + '</button>' : '');
  const f = studyFrame(deck, 'Flashcards', { progress: true, actions: '<button type="button" class="icon-btn" data-opts aria-label="Card options">' + icon('tune') + '</button>' });
  const groups = () => {
    const g = { new: [], learn: [], all: deck.cards.slice() };
    deck.cards.forEach(c => {
      const b = bucket(deck.id, c); const s = cardState(deck.id, c.id);
      if (b === 'new') g.new.push(c);
      else if (b === 'learn' && !(s && s.fk)) g.learn.push(c);
    });
    return g;
  };
  let scope, list = [], i = 0, known = 0, missed = [], flipped = false, busy = false, hintShown = false;
  const g0 = groups();
  scope = g0.new.length ? 'new' : g0.learn.length ? 'learn' : 'all';

  function start(sc, cards) {
    scope = sc;
    let base = cards || groups()[sc];
    limited = null;
    if (sc === 'new' && !cards) { const a = newAllowance(); if (a < base.length) { limited = a; base = base.slice(0, a); } }
    list = opt.shuffle ? shuffle(base.slice()) : base.slice();
    i = 0; known = 0; missed = []; render();
  }
  function chips() {
    const g = groups();
    const chip = (k, label, n) => '<button type="button" class="chip" data-scope="' + k + '" aria-pressed="' + (scope === k) + '"' + (n ? '' : ' disabled') + '>' + label + ' (' + n + ')</button>';
    return '<div class="chips" role="group" aria-label="Which cards">' + chip('new', 'New', g.new.length) + chip('learn', 'Still learning', g.learn.length) + chip('all', 'All cards', g.all.length) + '</div>';
  }
  function render() {
    setProgress(f, list.length ? i / list.length : 0);
    if (!list.length && limited === 0) {
      f.col.innerHTML = chips() + '<div class="q-card"><h2 style="margin:0;font-size:22px;font-weight:400">That\'s today\'s new words</h2><p class="q-ask">You have started ' + plural(newToday(), 'new word') + ' today, your daily limit. Practice them in Learn, or take on a few more.</p><div class="btn-row"><button type="button" class="btn" data-go="learn-' + deck.id + '">Practice in Learn</button><button type="button" class="btn tonal" data-more-new>Show 10 more</button></div></div>';
      wire();
      $('[data-more-new]', f.col).onclick = () => { addExtraToday(10); start('new'); };
      return;
    }
    if (!list.length) {
      f.col.innerHTML = chips() + '<div class="q-card"><h2 style="margin:0;font-size:22px;font-weight:400">Nothing in this group</h2><p class="q-ask">Every card here has been sorted. Pick another group above, or move on to Learn.</p><div class="btn-row"><button type="button" class="btn" data-go="learn-' + deck.id + '">Practice in Learn</button></div></div>';
      return wire();
    }
    if (i >= list.length) return renderDone();
    const card = list[i];
    flipped = false; hintShown = false;
    const front = opt.front === 'term' ? 'term' : 'definition';
    const back = front === 'term' ? 'definition' : 'term';
    const fText = sideText(card, front), bText = sideText(card, back);
    f.col.innerHTML = chips() +
      '<div class="fc-wrap"><div class="fc-count"><span>Card ' + (i + 1) + ' of ' + list.length + (limited !== null ? ' (today\'s limit)' : '') + '</span><span>' + known + ' known, ' + missed.length + ' still learning</span></div>' +
      '<div class="fc-stage"><div class="fc-card" tabindex="0" role="button" aria-label="Card. Press space to flip.">' +
      '<span class="fc-stamp know">Know it</span><span class="fc-stamp learn">Still learning</span>' +
      '<div class="fc-inner"><div class="fc-face fc-front' + (card.hint ? ' has-hint' : '') + '"><span class="fc-label">' + esc(front === 'term' ? L.term : L.definition) + '</span>' + sayBtn(card, front) +
      '<div class="fc-text' + (isLong(fText) ? ' long' : '') + '"' + langAttr(deck, front) + '>' + esc(fText) + '</div>' +
      (card.hint ? '<div class="fc-hintbox"><button type="button" class="btn text" data-hint>' + icon('hint') + 'Show hint</button><div class="fc-hint" hidden>' + esc(card.hint) + '</div></div>' : '') +
      '<span class="fc-tip">Tap to flip</span></div>' +
      '<div class="fc-face fc-back" aria-hidden="true"><span class="fc-label">' + esc(back === 'term' ? L.term : L.definition) + '</span>' + sayBtn(card, back) +

      '<div class="fc-actions"><button type="button" class="btn learn-btn" data-decide="0">Still learning</button><button type="button" class="btn" data-decide="1">Know it</button></div>' +
      '<div class="keys">Space flips the card. Left arrow: still learning. Right arrow: know it.</div></div>';
    wire();

    if (list[i + 1]) prefetchClips([list[i + 1]]);
  }
  function wire() {
    f.col.querySelectorAll('[data-scope]').forEach(b => { b.onclick = () => start(b.dataset.scope); });
    f.col.querySelectorAll('[data-go]').forEach(b => { b.onclick = () => go(b.dataset.go); });

    if (knows) known++; else missed.push(card);

  }

      '<p class="q-ask">' + (missed.length ? plural(missed.length, 'card is', 'cards are') + ' still sinking in. Learn will quiz you on them until they stick.' : 'You knew every card in this group. Learn will make sure you can recall them, not just recognize them.') + '</p>' +
      '<div class="btn-row"><button type="button" class="btn big" data-go="learn-' + deck.id + '">Practice in Learn</button>' +
      (missed.length ? '<button type="button" class="btn tonal" data-again>Review the ' + missed.length + ' still learning</button>' : '') +
      '<button type="button" class="btn text" data-go="deck-' + deck.id + '">Back to deck</button></div></div>';
    wire();

  }
  $('[data-opts]', app).onclick = e => showMenu(e.currentTarget, [
    { heading: true, label: 'Front of card' },
    { label: L.term, checked: opt.front === 'term', run: () => { opt.front = 'term'; lsSet(frontKey, 'term'); render(); } },
    { label: L.definition, checked: opt.front === 'definition', run: () => { opt.front = 'definition'; lsSet(frontKey, 'definition'); render(); } },
    '-',
    { label: 'Shuffle', icon: 'shuffle', checked: !!opt.shuffle, run: () => { opt.shuffle = !opt.shuffle; save(); start(scope); } }
  ].concat(deckAudio ? [{ label: 'Play audio automatically', icon: 'volume', checked: !!opt.autoplay, run: () => { opt.autoplay = !opt.autoplay; save(); } }] : []));
  function save() { lsSet('flashlet-flashcards', JSON.stringify({ shuffle: opt.shuffle, autoplay: opt.autoplay })); }
  const onKey = e => {
    if (typingTarget(e) || openMenuEl || $('.scrim')) return;
    if (e.key === ' ' || e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      if ($('.fc-card', f.col)) { e.preventDefault(); flip(); }

  };
  document.addEventListener('keydown', onKey);
  cleanupView = () => { document.removeEventListener('keydown', onKey); stopAudio(); };
  start(scope);
}

/* ================= Test ================= */
function showTest(deck) {
  const L = labelsOf(deck);
  const n = deck.cards.length;
  const opt = readJSON('flashlet-test', { count: 10, written: true, mc: true, tf: true });
  opt.answer = answerSideFor(deck);
  const f = studyFrame(deck, 'Test', { progress: true });
  let questions = [], ask, promptSide, submitted = false;

  function renderSetup() {
    setProgress(f, 0); submitted = false;
    const counts = [5, 10, 20].filter(c => c < n).concat([n]);
    if (counts.indexOf(opt.count) < 0) opt.count = counts.filter(c => c <= 10).pop() || counts[0];
    const chip = (attr, val, label, pressed) => '<button type="button" class="chip" ' + attr + '="' + val + '" aria-pressed="' + pressed + '">' + label + '</button>';
    f.col.innerHTML = '<div class="q-card setup"><h2 style="margin:0;font-size:24px;font-weight:400">Set up your test</h2>' +
      '<div><h3>Questions</h3><div class="chips">' + counts.map(c => chip('data-count', c, c === n ? 'All ' + n : String(c), opt.count === c)).join('') + '</div></div>' +
      '<div><h3>Question types</h3><div class="chips">' + chip('data-type', 'written', 'Written', !!opt.written) + chip('data-type', 'mc', 'Multiple choice', !!opt.mc) + chip('data-type', 'tf', 'True or false', !!opt.tf) + '</div></div>' +
      '<div><h3>Answer with</h3><div class="chips">' + chip('data-answer', 'definition', esc(L.definition), opt.answer !== 'term') + chip('data-answer', 'term', esc(L.term), opt.answer === 'term') + '</div></div>' +
      '<div class="btn-row"><button type="button" class="btn big" data-start>Start test</button></div></div>';
    f.col.querySelectorAll('[data-count]').forEach(b => { b.onclick = () => { opt.count = +b.dataset.count; renderSetup(); }; });
    f.col.querySelectorAll('[data-type]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.type; const on = ['written', 'mc', 'tf'].filter(t => opt[t]);
        if (opt[k] && on.length === 1) { toast('Keep at least one question type.'); return; }
        opt[k] = !opt[k]; renderSetup();
      };
    });
    f.col.querySelectorAll('[data-answer]').forEach(b => { b.onclick = () => { opt.answer = b.dataset.answer; setAnswerSide(deck, opt.answer); renderSetup(); }; });
    $('[data-start]', f.col).onclick = () => { lsSet('flashlet-test', JSON.stringify({ count: opt.count, written: opt.written, mc: opt.mc, tf: opt.tf })); build(); };
  }
  function build() {
    ask = opt.answer === 'term' ? 'term' : 'definition'; promptSide = ask === 'term' ? 'definition' : 'term';
    const types = shuffle(['written', 'mc', 'tf'].filter(t => opt[t]));
    questions = pick(deck.cards, Math.min(opt.count, n)).map((card, i) => {
      const q = { card, type: types[i % types.length], answer: null };
      if (q.type === 'mc') q.opts = shuffle([card].concat(distractors(deck, card, ask, 3)));
      if (q.type === 'tf') { const other = distractors(deck, card, ask, 1)[0]; q.claim = Math.random() < 0.5 || !other ? card : other; }
      return q;
    });
    questions = shuffle(questions);
    renderTest();
  }
  function typeLabel(t) { return t === 'written' ? 'Written' : t === 'mc' ? 'Multiple choice' : 'True or false'; }
  function renderTest() {
    const total = questions.length;
    f.col.innerHTML = questions.map((q, i) => {
      const p = sideText(q.card, promptSide);
      let body = '';
      if (q.type === 'written') body = '<label class="q-ask" for="tq-' + i + '">Type the ' + esc(labelNoun(deck, ask)) + '</label><input class="input" id="tq-' + i + '" data-i="' + i + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"' + langAttr(deck, ask) + '>';
      if (q.type === 'mc') body = '<p class="q-ask">Choose the matching ' + esc(labelNoun(deck, ask)) + '</p><div class="options">' + q.opts.map((o, k) => '<button type="button" class="opt" data-i="' + i + '" data-k="' + k + '" aria-pressed="false"><span class="opt-key">' + 'ABCD'[k] + '</span><span' + langAttr(deck, ask) + '>' + esc(sideText(o, ask)) + '</span></button>').join('') + '</div>';
      if (q.type === 'tf') body = '<div class="tf-claim"><small>' + esc(ask === 'term' ? L.term : L.definition) + '</small><span' + langAttr(deck, ask) + '>' + esc(sideText(q.claim, ask)) + '</span></div><p class="q-ask">Is this the right match?</p><div class="options"><button type="button" class="opt" data-i="' + i + '" data-tf="1" aria-pressed="false">True</button><button type="button" class="opt" data-i="' + i + '" data-tf="0" aria-pressed="false">False</button></div>';
      return '<section class="q-card test-q" id="tq-card-' + i + '"><div class="q-label"><span>Question ' + (i + 1) + ' of ' + total + '</span><span>' + typeLabel(q.type) + '</span></div><div class="q-prompt' + (isLong(p) ? ' long' : '') + '"' + langAttr(deck, promptSide) + '>' + esc(p) + '</div>' + body + '<div class="q-result"></div></section>';
    }).join('') + '<div class="q-card" data-submit-box><p class="q-ask" data-unanswered hidden></p><div class="btn-row"><button type="button" class="btn big" data-submit>Submit test</button><button type="button" class="btn text" data-setup>Change settings</button></div></div>';
    f.body.scrollTop = 0;
    f.col.querySelectorAll('input[data-i]').forEach(inp => {
      inp.oninput = () => { questions[+inp.dataset.i].answer = inp.value; tick(); };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const nx = $('#tq-card-' + (+inp.dataset.i + 1), f.col); if (nx) { const t = nx.querySelector('input, button'); if (t) t.focus(); nx.scrollIntoView({ block: 'center', behavior: 'smooth' }); } } };
    });
    f.col.querySelectorAll('.opt[data-i]').forEach(b => {
      b.onclick = () => {
        if (submitted) return;
        const q = questions[+b.dataset.i];
        q.answer = b.dataset.k !== undefined ? +b.dataset.k : b.dataset.tf === '1';
        $$('.opt', b.parentNode).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        tick();

    $('[data-submit]', f.col).onclick = () => submit(false);
    $('[data-setup]', f.col).onclick = renderSetup;
    tick();
  }
  const answered = q => q.answer !== null && q.answer !== '' && !(typeof q.answer === 'string' && !q.answer.trim());
  function tick() { setProgress(f, questions.filter(answered).length / questions.length); }
  function submit(force) {
    const missing = questions.filter(q => !answered(q)).length;
    const note = $('[data-unanswered]', f.col);
    if (missing && !force) {
      note.hidden = false;
      note.innerHTML = plural(missing, 'question has', 'questions have') + ' no answer yet. <button type="button" class="btn text" data-force style="padding:0 4px;min-height:0">Submit anyway</button>';
      $('[data-force]', note).onclick = () => submit(true);
      return;
    }
    submitted = true;
    let score = 0;
    questions.forEach((q, i) => {
      const card = q.card;
      if (q.type === 'written') q.ok = answered(q) && grade(q.answer, card, ask).ok;
      if (q.type === 'mc') q.ok = q.answer !== null && norm(sideText(q.opts[q.answer], ask)) === norm(sideText(card, ask));
      if (q.type === 'tf') { const truth = norm(sideText(q.claim, ask)) === norm(sideText(card, ask)); q.ok = q.answer !== null && q.answer === truth; q.truth = truth; }
      if (q.ok) score++;
      markResult(q, i);
    });
    const total = questions.length;
    const p = prog(deck.id); p.lastTest = { score, total, at: nowMs() }; p.lastStudied = nowMs(); markDirty('prog-' + deck.id);
    const box = $('[data-submit-box]', f.col); box.remove();
    const pct = Math.round(score / total * 100);
    const summary = document.createElement('section');
    summary.className = 'q-card';
    summary.innerHTML = '<div class="big-stat">' + pct + '%<small>' + score + ' of ' + total + ' correct</small></div>' +
      '<p class="q-ask">' + (pct === 100 ? 'A perfect score.' : pct >= 80 ? 'Solid work. Review the misses below.' : 'Review the misses below, then run them through Learn.') + '</p>' +
      '<div class="btn-row"><button type="button" class="btn" data-again>New test</button><button type="button" class="btn tonal" data-go="learn-' + deck.id + '">Practice in Learn</button><button type="button" class="btn text" data-go="deck-' + deck.id + '">Back to deck</button></div>';
    f.col.insertBefore(summary, f.col.firstChild);
    summary.querySelector('[data-again]').onclick = build;
    summary.querySelectorAll('[data-go]').forEach(b => { b.onclick = () => go(b.dataset.go); });
    setProgress(f, 1);
    f.body.scrollTop = 0;
    function markResult(q, i) {
      const sec = $('#tq-card-' + i, f.col);
      sec.classList.add(q.ok ? 'graded-good' : 'graded-bad');
      $$('input, button', sec).forEach(x => { if (x.tagName === 'INPUT') x.readOnly = true; else x.disabled = true; });
      if (q.type === 'mc') $$('.opt', sec).forEach((b, k) => { if (norm(sideText(q.opts[k], ask)) === norm(sideText(q.card, ask))) b.classList.add('correct'); else if (q.answer === k) b.classList.add('wrong'); });
      if (q.type === 'tf') $$('.opt', sec).forEach(b => { const v = b.dataset.tf === '1'; if (v === q.truth) b.classList.add('correct'); else if (q.answer === v) b.classList.add('wrong'); });
      const res = $('.q-result', sec);

      else {
        res.innerHTML = '<p class="result-note bad">' + (answered(q) ? 'Incorrect' : 'No answer') + '</p><p class="q-ask">Correct answer: <b' + langAttr(deck, ask) + '>' + esc(sideText(q.card, ask)) + '</b></p>' +
          (q.type === 'written' && answered(q) ? '<button type="button" class="btn text" data-right style="padding:0">I was right</button>' : '');
        const r = $('[data-right]', res);
        if (r) r.onclick = () => {
          q.ok = true; score++; sec.classList.remove('graded-bad'); sec.classList.add('graded-good');
          res.innerHTML = '<p class="result-note good">Counted as correct</p>';
          const pc = Math.round(score / total * 100);
          summary.querySelector('.big-stat').innerHTML = pc + '%<small>' + score + ' of ' + total + ' correct</small>';
          p.lastTest = { score, total, at: nowMs() }; markDirty('prog-' + deck.id);
        };
      }
    }
  }
  renderSetup();
}

/* ================= Match ================= */
function showMatch(deck) {
  const L = labelsOf(deck);
  const PAIRS = Math.min(6, deck.cards.length);
  const PENALTY_MS = 1000;
  const f = studyFrame(deck, 'Match', {
    inner: '<div class="match-top"><span class="mode-chip" id="mode-chip"></span><div class="clock"><span class="clock-num" id="clock-num">0.0</span><span class="clock-unit">sec</span><span class="penalty" id="penalty" aria-hidden="true">+1.0</span></div><button type="button" class="btn text" id="new-round">' + icon('restart') + 'New round</button></div>' +
      '<div class="match-stage"><div class="board" id="board" role="group" aria-label="Cards"></div><div class="overlay" id="overlay"><div class="sheet" id="panel" role="dialog" aria-labelledby="panel-title"></div></div></div><p class="sr" id="live" aria-live="polite"></p>'
  });
  const board = $('#board', app), overlay = $('#overlay', app), panel = $('#panel', app);
  const clockNum = $('#clock-num', app), penaltyEl = $('#penalty', app), modeChip = $('#mode-chip', app), live = $('#live', app);
  const wideMQ = matchMedia('(min-width: 760px) and (min-height: 540px)');
  let mode = wideMQ.matches ? 'drag' : 'tap';
  let game = null, selected = null, drag = null, suppressClick = false, zTop = 10, ro = null, roPending = 0;
  const announce = msg => { live.textContent = ''; requestAnimationFrame(() => { live.textContent = msg; }); };
  const setClock = ms => { clockNum.textContent = fmtSec(ms); };
  const bestKey = m => 'match-' + m;
  const bestOf = m => { const p = store.progress.get(deck.id); return p && p.best ? p.best[bestKey(m)] : null; };

  function deal() {
    if (game) cancelAnimationFrame(game.raf);
    const picks = pick(deck.cards, PAIRS);
    const cards = [];
    picks.forEach((c, i) => { cards.push({ pair: i, kind: 'term', text: c.term, src: c }); cards.push({ pair: i, kind: 'definition', text: c.definition, src: c }); });
    shuffle(cards);
    game = { picks, cards, phase: 'ready', start: 0, penalty: 0, wrong: 0, matched: 0, order: [], raf: 0, endMode: mode };
    selected = null; drag = null; zTop = 10;
    board.textContent = '';
    cards.forEach((c, i) => {
      c.id = i; c.matched = false; c.free = null; c.jx = Math.random(); c.jy = Math.random();
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'tile ghost'; el.dataset.id = i; el.tabIndex = -1; el.setAttribute('aria-hidden', 'true');
      const l = langOf(deck, c.kind); if (l) el.lang = l;
      const t = document.createElement('span'); t.className = 't'; t.textContent = c.text;
      el.appendChild(t); c.el = el; c.t = t; board.appendChild(el);
    });
    setClock(0);
    layout();
  }
  function layout() {

    board.classList.toggle('tap', mode === 'tap');
    const W = board.clientWidth, H = board.clientHeight;
    if (!W || !H) return;
    const n = game.cards.length;
    if (mode === 'tap') {
      const cols = W > H * 1.15 ? 4 : 3;
      const rows = Math.ceil(n / cols);
      board.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
      board.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
      const base = Math.round(clamp(Math.min(W / cols, H / rows) / 6.2, 13, 19));
      game.cards.forEach(c => { const s = c.el.style; s.left = s.top = s.width = s.height = s.zIndex = ''; c.base = base; });
    } else {
      board.style.gridTemplateColumns = board.style.gridTemplateRows = '';
      const cols = 4, rows = Math.ceil(n / 4);
      const cw = W / cols, ch = H / rows;
      const w = Math.round(Math.min(cw - 12, Math.max(140, cw * 0.8), 236));
      const h = Math.round(Math.min(ch - 12, Math.max(78, ch * 0.6), 130));
      game.cards.forEach((c, i) => {
        c.w = w; c.h = h;
        if (c.free) { c.x = c.free.fx * Math.max(0, W - w); c.y = c.free.fy * Math.max(0, H - h); }
        else { const cx = i % cols, cy = Math.floor(i / cols); c.x = cx * cw + c.jx * Math.max(0, cw - w); c.y = cy * ch + c.jy * Math.max(0, ch - h); }
        Object.assign(c.el.style, { left: c.x + 'px', top: c.y + 'px', width: w + 'px', height: h + 'px' });
        c.base = Math.round(clamp(w / 10.5, 15, 20));
      });
    }
    game.cards.forEach(fit);
  }
  function fit(c) {
    let size = c.base; c.t.style.fontSize = size + 'px';
    let guard = 12;
    while (guard-- > 0 && size > 11 && (c.t.scrollWidth > c.t.clientWidth + 1 || c.t.scrollHeight > c.el.clientHeight - 8)) { size -= 1; c.t.style.fontSize = size + 'px'; }
  }
  function updateModeUI() { modeChip.innerHTML = icon(mode === 'drag' ? 'drag' : 'tap') + '<span>' + (mode === 'drag' ? 'Drag mode' : 'Tap mode') + '</span>'; modeChip.title = 'Wide windows use drag mode. Narrow screens use tap mode.'; }
  function onResize() {

  function startGame() {

    game.cards.forEach((c, i) => {

/* ================= Meteor (Blast-style game) ================= */
function showMeteor(deck) {
  const L = labelsOf(deck);
  const f = studyFrame(deck, 'Meteor', {
    inner: '<div class="sky" id="sky"><div class="hud"><div class="hud-score"><span id="score">0</span><small id="best"></small></div><div class="lives" id="lives" aria-label="3 lives left"></div></div><div class="combo" id="combo"></div><div id="field"></div>' +
      '<div class="ground" id="ground"><div class="ground-label">' + esc(L.term) + '</div><div class="ground-term" id="prompt"' + langAttr(deck, 'term') + '>&nbsp;</div></div>' +
      '<div class="overlay" id="overlay"><div class="sheet" id="panel" role="dialog" aria-labelledby="panel-title"></div></div><p class="sr" id="live" aria-live="polite"></p></div>'
  });
  const sky = $('#sky', app), field = $('#field', app), ground = $('#ground', app), promptEl = $('#prompt', app);
  const overlay = $('#overlay', app), panel = $('#panel', app), scoreEl = $('#score', app), bestEl = $('#best', app), livesEl = $('#lives', app), comboEl = $('#combo', app), live = $('#live', app);
  const LIVES = 3;
  let s = null, raf = 0, last = 0, lastCard = null;
  const bestScore = () => { const p = store.progress.get(deck.id); return p && p.best && p.best.meteor != null ? p.best.meteor : null; };
  function hud() {
    scoreEl.textContent = s ? s.score : 0;
    const b = bestScore(); bestEl.textContent = b != null ? 'best ' + b : '';
    const lives = s ? s.lives : LIVES;
    livesEl.innerHTML = Array.from({ length: LIVES }, (_, k) => '<span class="' + (k < lives ? '' : 'lost') + '">' + icon('heart') + '</span>').join('');
    livesEl.setAttribute('aria-label', plural(lives, 'life', 'lives') + ' left');
    comboEl.textContent = s && s.combo >= 2 ? s.combo + ' in a row' : '';
  }
  function fallTime() { const level = Math.floor(s.correct / 4); return Math.max(3.4, 8.5 * Math.pow(0.92, level)); }
  function clearField() { s.meteors.forEach(m => m.el.remove()); s.meteors = []; }

    if (!s || !s.running) return;
    clearField();
    ground.classList.remove('flash-bad', 'flash-good');
    let card;
    do { card = deck.cards[Math.floor(Math.random() * deck.cards.length)]; } while (deck.cards.length > 1 && card === lastCard);
    lastCard = card; s.card = card;
    promptEl.textContent = card.term;
    const options = shuffle([card].concat(distractors(deck, card, 'definition', 3)));

    // Narrow screens get fewer, wider lanes; meteors sharing a lane fall in single file.

    const lanes = shuffle(Array.from({ length: laneCount }, (_, i) => i));
    const laneTop = lanes.map(() => 40 - Math.random() * groundY * 0.12);

      const el = document.createElement('button');
      el.type = 'button'; el.className = 'meteor';
      el.style.width = w + 'px';
      const l = langOf(deck, 'definition'); if (l) el.lang = l;
      const t = document.createElement('span'); t.textContent = o.definition; el.appendChild(t);
      field.appendChild(el);
      let size = 15; t.style.fontSize = size + 'px';
      while (size > 11 && t.scrollWidth > el.clientWidth - 24) { size--; t.style.fontSize = size + 'px'; }
      const h = el.offsetHeight;
      const lane = lanes[i % laneCount];
      const y = laneTop[i % laneCount] - h - 16;
      laneTop[i % laneCount] = y - 24;
      const m = { el, card: o, correct: o === card, x: 8 + lane * laneW + (laneW - w) / 2, y, h, dead: false, vy: speed };
      el.style.transform = 'translate3d(' + m.x + 'px,' + m.y + 'px,0)';
      el.addEventListener('pointerdown', e => { e.preventDefault(); hit(m); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(m); } });

      m.el.style.transform += ' scale(1.15)'; m.el.classList.add('hit');

  function startGame() {
    overlay.hidden = true;

  }
  function gameOver() {

    const missed = Array.from(s.missed.values());
    setTimeout(() => {
      panel.innerHTML = '<h2 id="panel-title">Game over</h2><div class="result-time">' + s.score + '<small>points</small></div>' +
        (r.prev == null ? '<p class="result-note good">Saved as your high score</p>' : r.better ? '<p class="result-note good">New high score. Previous: ' + r.prev + '</p>' : '<p style="color:var(--ink);font-weight:500">Your high score is ' + r.prev + '</p>') +
        '<p>' + plural(s.correct, 'answer') + ' stopped before landing.</p>' +
        (missed.length ? '<table class="review"><thead><tr><th scope="col">' + esc(L.term) + '</th><th scope="col">' + esc(L.definition) + '</th></tr></thead><tbody>' + missed.map(c => '<tr><td' + langAttr(deck, 'term') + '>' + esc(c.term) + '</td><td' + langAttr(deck, 'definition') + '>' + esc(c.definition) + '</td></tr>').join('') + '</tbody></table>' : '') +
        '<div class="btn-row" style="justify-content:stretch"><button type="button" class="btn big block" id="again-btn">Play again</button></div>';

    }, 700);
  }
  function renderStart() {
    const b = bestScore();
    panel.innerHTML = '<h2 id="panel-title">Meteor</h2><p>Answers fall toward the ground. Tap the ' + esc(labelNoun(deck, 'definition')) + ' that matches the ' + esc(labelNoun(deck, 'term')) + ' at the bottom before it lands.</p><p>A wrong tap or a missed answer costs a life, and you have ' + LIVES + '. The meteors speed up as you go.</p>' +
      (b != null ? '<p style="color:var(--ink)">Your high score: <b>' + b + '</b></p>' : '') +
      '<button type="button" class="btn big block" id="start-btn">Start game</button>';

  }
  const onVis = () => {

  };

/* ================= Learn (practice) ================= */
// Stages per card: multiple choice, then typed recall, then (for cards with audio) listening with no
// text on screen: pick the meaning, then type what you hear or type its meaning.
function showLearn(deck) {
  const L = labelsOf(deck);
  const deckAudio = deck.cards.some(c => c.audio);
  const opt = readJSON('flashlet-learn', { answer: 'definition', typed: true, listening: true });
  const f = studyFrame(deck, 'Learn', { progress: true, actions: '<button type="button" class="icon-btn" data-opts aria-label="Learn options">' + icon('tune') + '</button>' });
  let ask, promptSide, roundNo = 0, roundCards = [], queue = [], passed = new Set(), current = null, locked = false, onEnter = null, advanceTimer = 0;
  const lv = c => level(deck.id, c.id);
  const ls = c => listenLevel(deck.id, c.id);
  const st = c => cardState(deck.id, c.id) || {};
  const isListen = s => s === 'listen-mc' || s === 'listen-term' || s === 'listen-def';
  const startedMastered = deckCounts(deck).done === deck.cards.length;
  function configure() { ask = answerSideFor(deck); promptSide = ask === 'term' ? 'definition' : 'term'; }
  configure();
  const promptLabel = () => (promptSide === 'term' ? L.term : L.definition);

  function stageFor(c) {
    if (lv(c) < 2) return 'mc';
    if (lv(c) < 3) return opt.typed ? 'write' : 'mc';
    if (c.audio && ls(c) < 2) {
      if (!opt.listening) return null;
      if (ls(c) < 1 || !opt.typed) return 'listen-mc';
      return Math.random() < 0.5 ? 'listen-term' : 'listen-def';
    }
    return null;
  }
  const waitingOnListening = () => deck.cards.filter(c => c.audio && lv(c) >= 3 && ls(c) < 2).length;
  const rank = s => ({ 'listen-term': 0, 'listen-def': 0, 'listen-mc': 1, write: 2, mc: 3 })[s];

  function startRound() {
    clearTimeout(advanceTimer);
    const items = deck.cards.map(c => ({ card: c, stage: stageFor(c) })).filter(x => x.stage);
    if (!items.length) return renderDone();
    roundNo++;
    const unseen = c => (cardState(deck.id, c.id) ? 0 : 1);
    const sorted = shuffle(items).sort((a, b) => (rank(a.stage) - rank(b.stage)) || (unseen(a.card) - unseen(b.card)));
    let newLeft = newAllowance();
    const chosen = [];
    for (const it of sorted) {
      if (chosen.length >= 7) break;
      if (unseen(it.card)) { if (newLeft <= 0) continue; newLeft--; }
      chosen.push(it);
    }
    if (!chosen.length) { roundNo--; return renderLimit(); }
    roundCards = chosen.map(x => x.card);
    queue = shuffle(chosen);
    passed = new Set();
    prefetchClips(roundCards);
    next();
  }
  function next() {
    clearTimeout(advanceTimer); onEnter = null;
    setProgress(f, roundCards.length ? passed.size / roundCards.length : 0);
    if (!queue.length) return renderSummary();
    current = queue.shift(); locked = false;
    if (current.stage === 'mc') renderMC();
    else if (current.stage === 'write') renderWrite();
    else renderListen();
  }
  function stageName(s) { return ({ mc: 'multiple choice', write: 'type it', 'listen-mc': 'listening', 'listen-term': 'listening', 'listen-def': 'listening' })[s]; }
  function head(card) {
    const p = sideText(card, promptSide);
    const say = promptSide === 'term' && card.audio ? '<button type="button" class="say" data-say aria-label="Play audio">' + icon('volume') + '</button>' : '';
    return '<div class="q-label"><span>' + esc(promptLabel()) + '</span><span>Round ' + roundNo + ', ' + stageName(current.stage) + '</span></div>' +
      '<div class="q-prompt-row">' + say + '<div class="q-prompt' + (isLong(p) ? ' long' : '') + '"' + langAttr(deck, promptSide) + '>' + esc(p) + '</div></div>' +
      (card.hint ? '<div><button type="button" class="btn text" data-hint style="padding:0">' + icon('hint') + 'Show hint</button><div class="hint-line" hidden>' + esc(card.hint) + '</div></div>' : '');
  }
  function wireHead() {
    const h = $('[data-hint]', f.col); if (h) h.onclick = () => { h.hidden = true; h.nextElementSibling.hidden = false; };
    const s = $('[data-say]', f.col); if (s) s.onclick = () => playClip(current.card.audio, { button: s });
  }
  function options(card, side) {

  function feedback(good, rows, title, canOverride, auto) {

    fb.innerHTML = '<div class="feedback ' + (good ? 'good' : 'bad') + '" role="status"><h3>' + esc(title || (good ? 'Correct' : 'Not quite')) + '</h3>' +

      ((rows && !auto) || !good ? '<div class="btn-row"><button type="button" class="btn" data-continue>Continue</button>' + say + (canOverride ? '<button type="button" class="btn text" data-override>I was right</button>' : '') + '</div>' : (say ? '<div class="btn-row">' + say + '</div>' : '')) + '</div>';
