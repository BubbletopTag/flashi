name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: npm ci
      - run: pip install -r scripts/requirements.txt
      - run: npm run typecheck
      - run: npm test
        env:
          FLASHI_ANKI_PYTHON: python
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: flashi-builds
          path: |
            dist/flashi.html
            dist-pwa/
      - run: npm run golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report
          path: golden/report/
